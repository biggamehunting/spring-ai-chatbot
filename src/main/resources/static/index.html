<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spring AI Chatbot</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 820px; margin: 0 auto; padding: 24px; }
    h1 { margin-bottom: 4px; }
    .sub { opacity: .72; margin-top: 0; }
    #chat { border: 1px solid #8886; border-radius: 12px; padding: 16px; min-height: 340px; }
    .msg { padding: 12px 14px; border-radius: 10px; margin: 10px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { background: #4f7cff22; }
    .bot { background: #88888818; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    textarea { flex: 1; resize: vertical; min-height: 58px; padding: 12px; border-radius: 8px; font: inherit; }
    button { padding: 0 18px; border: 0; border-radius: 8px; cursor: pointer; font: inherit; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 1.4em; opacity: .75; }
    .hint { font-size: .9rem; opacity: .75; }
  </style>
</head>
<body>
  <h1>Spring AI Chatbot</h1>
  <p class="sub">Spring Boot · Spring AI · OpenAI-compatible chat model</p>
  <div id="chat" aria-live="polite">
    <div class="msg bot">Hi! Ask me a question to get started.</div>
  </div>
  <p id="status" role="status"></p>
  <form id="form">
    <textarea id="message" placeholder="Type your message… (Enter to send, Shift+Enter for newline)" required maxlength="8000"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <p class="hint">Your API key stays on the server. This starter does not persist chat history.</p>
<script>
const form = document.querySelector('#form');
const input = document.querySelector('#message');
const chat = document.querySelector('#chat');
const status = document.querySelector('#status');
const send = document.querySelector('#send');

function addMessage(text, role) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.textContent = text;
  chat.appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message || send.disabled) return;

  addMessage(message, 'user');
  input.value = '';
  send.disabled = true;
  status.textContent = 'Thinking…';

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || data.message || `Request failed (${response.status})`);
    addMessage(data.answer || '(No response)', 'bot');
    status.textContent = '';
  } catch (error) {
    addMessage(`Sorry, the request failed: ${error.message}`, 'bot');
    status.textContent = 'Check the server logs and API-key configuration.';
  } finally {
    send.disabled = false;
    input.focus();
  }
});

input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
